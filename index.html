<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secret Pet Hatch Calculator</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f14;
    color: #eaeaea;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .box {
    background: #1c1c26;
    padding: 20px;
    border-radius: 10px;
    width: 400px;
  }
  input, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    font-size: 16px;
  }
  button {
    cursor: pointer;
  }
  pre {
    margin-top: 15px;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<div class="box">
  <h2>Secret Pet Hatch Calculator</h2>
  <input id="input" placeholder="Example: 1/25k 18.2 7">
  <button id="calcBtn">Calculate</button>
  <pre id="output"></pre>
</div>

<script>
function parseRarity(input) {
  input = input.toLowerCase().replace(/,/g, "").trim();

  // Fraction format (1/25000 or 1/25k)
  if (input.includes("/")) {
    let parts = input.split("/");
    let denom = parts[1];
    if (denom.endsWith("k")) denom = Number(denom.replace("k",""))*1000;
    return Number(denom);
  }

  // Decimal probability (0 < input < 1)
  let val = Number(input);
  if(val > 0 && val < 1) {
    return Math.round(1 / val);
  }

  // k format (25k)
  if (input.endsWith("k")) return Number(input.replace("k",""))*1000;

  // Plain number (already base rarity)
  return Number(input);
}

document.getElementById("calcBtn").addEventListener("click", function() {
  const parts = document.getElementById("input").value.trim().split(" ");
  if(parts.length !== 3){
    document.getElementById("output").textContent = "Enter exactly: rarity luck eggs";
    return;
  }

  const base = parseRarity(parts[0]);
  const luck = Number(parts[1]);
  const eggs = Number(parts[2]);

  if(!base || base <= 0 || !luck || luck <= 0 || !eggs || eggs <= 0){
    document.getElementById("output").textContent = "All numbers must be greater than 0";
    return;
  }

  const odds = base / luck;
  const batches = odds / eggs;
  const seconds = batches * 2.78;

  let time;
  if(seconds < 60) time = `${seconds.toFixed(2)} seconds`;
  else if(seconds < 3600) time = `${(seconds/60).toFixed(2)} minutes`;
  else if(seconds < 86400) time = `${(seconds/3600).toFixed(2)} hours`;
  else time = `${(seconds/86400).toFixed(2)} days`;

  document.getElementById("output").textContent =
`Chances: 1/${Math.round(odds).toLocaleString()}
Time to Hatch: ~${time}

How this was calculated (brief):

• Base rarity → 1/${base.toLocaleString()}
• Luck ${luck}x → ${base.toLocaleString()} ÷ ${luck}
• ${eggs} eggs per batch
• 2.78 seconds per batch
• Expected batches ≈ ${Math.round(batches).toLocaleString()}
`;
});
</script>

</body>
</html>
