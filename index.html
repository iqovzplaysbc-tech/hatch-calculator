<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secret Pet Hatch Calculator - Advanced</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f14;
    color: #eaeaea;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 30px;
  }
  .box {
    background: #1c1c26;
    padding: 20px;
    border-radius: 10px;
    width: 420px;
  }
  .input-group {
    margin-bottom: 10px;
  }
  .input-group label {
    display: block;
    font-size: 14px;
    margin-bottom: 2px;
  }
  .input-group input {
    width: 100%;
    padding: 6px;
    font-size: 14px;
  }
  button {
    width: 100%;
    padding: 8px;
    font-size: 16px;
    margin-top: 10px;
    cursor: pointer;
    border-radius: 5px;
  }
  pre {
    margin-top: 15px;
    white-space: pre-wrap;
    font-size: 14px;
    background: #0f0f14;
    padding: 10px;
    border-radius: 5px;
  }
</style>
</head>
<body>

<div class="box">
  <h2>Secret Pet Hatch Calculator</h2>

  <div class="input-group">
    <label for="baseRarity">Base Rarity</label>
    <input id="baseRarity" placeholder="0.0002%, 1/25k, 25k, etc.">
  </div>

  <div class="input-group">
    <label for="yourLuck">Your Luck</label>
    <input id="yourLuck" placeholder="Your in-game luck multipliers">
  </div>

  <div class="input-group">
    <label for="eventLuck">Event Luck</label>
    <input id="eventLuck" value="1" placeholder="Optional, default 1">
  </div>

  <div class="input-group">
    <label for="adminLuck">Admin Abuse Luck</label>
    <input id="adminLuck" value="1" placeholder="Optional, default 1">
  </div>

  <div class="input-group">
    <label for="eggsBatch">Eggs per Batch</label>
    <input id="eggsBatch" placeholder="Number of eggs hatched at once">
  </div>

  <div class="input-group">
    <label for="hatchSpeed">Hatch Speed (s per batch)</label>
    <input id="hatchSpeed" value="2.57" placeholder="Default 2.57s">
  </div>

  <div class="input-group">
    <label for="hatchEvent">Hatch Speed Event Multiplier</label>
    <input id="hatchEvent" value="1" placeholder="Optional, default 1">
  </div>

  <button id="calcBtn">Calculate</button>
  <pre id="output"></pre>
</div>

<script>
function parseRarity(input) {
  input = input.toLowerCase().replace(/,/g,"").trim();

  if(input.endsWith("%")) {
    let val = Number(input.replace("%",""))/100;
    return Math.round(1/val);
  }

  if(input.includes("/")) {
    let parts = input.split("/");
    let denom = parts[1];
    if(denom.endsWith("k")) denom = Number(denom.replace("k",""))*1000;
    return Number(denom);
  }

  let val = Number(input);
  if(val>0 && val<1) return Math.round(1/val);

  if(input.endsWith("k")) return Number(input.replace("k",""))*1000;

  return Number(input);
}

document.getElementById("calcBtn").addEventListener("click", function() {
  const base = parseRarity(document.getElementById("baseRarity").value);
  const yourLuck = Number(document.getElementById("yourLuck").value) || 1;
  const eventLuck = Number(document.getElementById("eventLuck").value) || 1;
  const adminLuck = Number(document.getElementById("adminLuck").value) || 1;
  const eggsBatch = Number(document.getElementById("eggsBatch").value);
  const hatchSpeed = Number(document.getElementById("hatchSpeed").value) || 2.57;
  const hatchEvent = Number(document.getElementById("hatchEvent").value) || 1;

  if(!base || !eggsBatch || eggsBatch <=0){
    document.getElementById("output").textContent="Please enter valid Base Rarity and Eggs per Batch.";
    return;
  }

  const totalLuck = yourLuck * eventLuck * adminLuck;
  const odds = base / totalLuck;
  const totalBatches = odds / eggsBatch;
  const adjustedHatchTime = hatchSpeed / hatchEvent;
  const totalTimeSec = totalBatches * adjustedHatchTime;

  let displayTime;
  if(totalTimeSec < 60) displayTime = totalTimeSec.toFixed(2) + " seconds";
  else if(totalTimeSec < 3600) displayTime = (totalTimeSec/60).toFixed(2) + " minutes";
  else if(totalTimeSec < 86400) displayTime = (totalTimeSec/3600).toFixed(2) + " hours";
  else displayTime = (totalTimeSec/86400).toFixed(2) + " days";

  document.getElementById("output").textContent =
`Total Luck: ${totalLuck.toLocaleString()}x
Chances per Egg: 1/${Math.round(odds).toLocaleString()}
Total Batches Needed: ${Math.round(totalBatches).toLocaleString()}
Adjusted Hatch Time per Batch: ${adjustedHatchTime.toFixed(2)} seconds
Time to Hatch: ~${displayTime}

Breakdown:
• Base Rarity → 1/${base.toLocaleString()}
• Your Luck → ${yourLuck}x
• Event Luck → ${eventLuck}x
• Admin Abuse Luck → ${adminLuck}x
• Eggs per Batch → ${eggsBatch}
• Hatch Speed → ${hatchSpeed} s/batch ÷ ${hatchEvent} event multiplier
`;
});
</script>

</body>
</html>
