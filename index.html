<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secret Pet Hatch Calculator</title>
<style>
body {
  background:#0f1220;
  color:#fff;
  font-family:Arial, sans-serif;
  max-width:900px;
  margin:auto;
  padding:20px;
}
h1,h2 {
  text-align:center;
}
.box {
  background:#1b1f3b;
  border-radius:12px;
  padding:16px;
  margin-bottom:20px;
}
label {
  display:block;
  margin-top:10px;
  font-size:14px;
}
input, select, button {
  width:100%;
  padding:8px;
  margin-top:4px;
  border-radius:6px;
  border:none;
}
button {
  background:#5d6bff;
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
}
button:hover { background:#7885ff; }
.small {
  font-size:13px;
  opacity:0.85;
}
.result-line { margin:6px 0; }
.owner {
  background:#2a2f66;
  border-left:6px solid #5d6bff;
}
.footer {
  text-align:center;
  opacity:0.6;
  margin-top:30px;
}
</style>
</head>

<body>

<h1>🐣 Secret Pet Hatch Calculator</h1>

<div id="ownerBox" class="box owner" style="display:none;">
  <b>📢 Owner Message:</b>
  <div id="ownerText"></div>
</div>

<div class="box">
<h2>⚙️ Inputs</h2>

<label>Egg</label>
<select id="eggSelect"></select>

<label>Your Luck (potions + gamepasses)</label>
<input id="luck" placeholder="Ex: 22.8">

<label>Event Luck</label>
<input id="eventLuck" placeholder="Ex: 2">

<label>Admin Abuse Luck</label>
<input id="adminLuck" placeholder="Ex: 1000">

<label>Eggs Per Hatch</label>
<input id="eggsPer" value="8">

<label>Hatch Speed Multiplier</label>
<input id="hatchSpeed" value="1">

<button onclick="calculate()">Calculate</button>
<button onclick="simulate()">Simulate 100 Hatches</button>
</div>

<div class="box">
<h2>📊 Results</h2>
<div id="results"></div>
</div>

<div class="box">
<h2>🧪 Simulation</h2>
<div id="simResults"></div>
</div>

<div class="footer">By: iQovz</div>

<script>
/* =========================
   OWNER MESSAGE (EDIT ME)
========================= */
const OWNER_MESSAGE = "🔥 2x Luck Event Live! Fire Ring Egg boosted!";

/* =========================
   LUCK TIERS (EDITABLE)
========================= */
const LUCK_TIERS = [
  { min: 0, label: "😴 Unlucky" },
  { min: 5, label: "🙂 Average" },
  { min: 15, label: "🔥 Juiced" },
  { min: 30, label: "💀 Insane" },
  { min: 75, label: "👑 Admin Level" }
];

/* =========================
   EGGS CONFIG (MAIN EDIT ZONE)
========================= */
const EGGS = {
  "Basic Egg": {
    pets: [
      { name:"Dragon", rarity:"Legendary", chance:100 },
      { name:"Royal Blob", rarity:"Secret", chance:100000 }
    ]
  },
  "Shark Egg": {
    pets:[{ name:"Shark", rarity:"Legendary", chance:100 }]
  },
  "Glacier Egg": {
    pets:[
      { name:"Yeti", rarity:"Legendary", chance:52.63 },
      { name:"Frost Dragon", rarity:"Mythic", chance:1000 }
    ]
  },
  "Mystic Egg": {
    pets:[
      { name:"Taurus", rarity:"Legendary", chance:52.63 },
      { name:"Goblin", rarity:"Mythic", chance:1000 },
      { name:"Mystic Hexo", rarity:"Secret", chance:100000 }
    ]
  },
  "Crystal Egg": {
    pets:[
      { name:"Dominus", rarity:"Mythic", chance:1000 },
      { name:"Flying Gem", rarity:"Secret", chance:100000 }
    ]
  },
  "Blossom Egg": {
    pets:[
      { name:"Blossom Dominus", rarity:"Mythic", chance:1000 },
      { name:"Flower Trophy", rarity:"Secret", chance:100000 },
      { name:"Eternal Flower", rarity:"Secret", chance:500000 }
    ]
  },
  "Magic Egg": {
    pets:[{ name:"Clown", rarity:"Secret", chance:25000 }]
  },
  "Fire Ring Egg": {
    pets:[
      { name:"Festival Bunny", rarity:"Legendary", chance:100 },
      { name:"Festival Dragon", rarity:"Mythic", chance:1000 },
      { name:"Fire Ring Lion", rarity:"Secret", chance:100000 },
      { name:"Ultra Dice", rarity:"Secret", chance:500000 }
    ]
  }
};

/* =========================
   SETUP
========================= */
const eggSelect = document.getElementById("eggSelect");
Object.keys(EGGS).forEach(e => {
  const o = document.createElement("option");
  o.value = e; o.textContent = e;
  eggSelect.appendChild(o);
});

if (OWNER_MESSAGE) {
  document.getElementById("ownerBox").style.display="block";
  document.getElementById("ownerText").textContent = OWNER_MESSAGE;
}

function getLuckTier(luck) {
  let tier = LUCK_TIERS[0].label;
  LUCK_TIERS.forEach(t => { if (luck >= t.min) tier = t.label; });
  return tier;
}

/* =========================
   CALCULATE
========================= */
function calculate() {
  const egg = EGGS[eggSelect.value];
  const luck = (+luck.value||1) + (+eventLuck.value||0) + (+adminLuck.value||0);
  const eggsPer = +eggsPer.value||1;
  const hatchSpeed = +hatchSpeed.value||1;
  const batchTime = 2.57 / hatchSpeed;

  let bestSecret = egg.pets.filter(p=>p.rarity==="Secret")[0];
  let adjChance = bestSecret.chance / luck;
  let batches = adjChance / eggsPer;
  let timeMin = (batches * batchTime) / 60;

  document.getElementById("results").innerHTML = `
    <div class="result-line">Your Current Luck: ${luck.toFixed(2)}x</div>
    <div class="result-line">Luck Tier: ${getLuckTier(luck)}</div>
    <div class="result-line">Chances: 1/${Math.round(adjChance).toLocaleString()}</div>
    <div class="result-line">Adjusted Hatch Time per Batch: ${batchTime.toFixed(2)}s</div>
    <div class="result-line">Time to Hatch: ~${timeMin.toFixed(2)} minutes</div>
  `;
}

/* =========================
   SIMULATOR
========================= */
function simulate() {
  const egg = EGGS[eggSelect.value];
  let results={Legendary:0,Mythic:0,Secret:0};
  let rarest=null;

  for(let i=0;i<100;i++){
    egg.pets.forEach(p=>{
      if(Math.random() < 1/p.chance){
        results[p.rarity]++;
        if(!rarest || p.chance>rarest.chance) rarest=p;
      }
    });
  }

  document.getElementById("simResults").innerHTML = `
    Legendary: ${results.Legendary}<br>
    Mythic: ${results.Mythic}<br>
    Secret: ${results.Secret}<br>
    Rarest Pet: ${rarest ? rarest.name : "None"}
  `;
}
</script>

</body>
</html>
