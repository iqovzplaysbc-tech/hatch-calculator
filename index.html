<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secret Pet Hatch Calculator</title>

<style>
body{
  background:#0e1024;
  color:#fff;
  font-family:Arial,sans-serif;
  max-width:800px;
  margin:auto;
  padding:20px;
}
h1{text-align:center;}
.menu{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:20px;
}
.menu button{
  flex:1;
  background:#2b2f66;
  color:white;
  border:none;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}
.menu button.active{background:#5d6bff;}
.section{
  display:none;
  background:#1a1e44;
  padding:16px;
  border-radius:12px;
}
label{display:block;margin-top:10px;font-size:14px;}
input,select{
  width:100%;
  padding:8px;
  margin-top:4px;
  border-radius:6px;
  border:none;
}
button.action{
  width:100%;
  margin-top:14px;
  padding:10px;
  background:#5d6bff;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
.owner{
  background:#2a2f66;
  border-left:6px solid #5d6bff;
  padding:10px;
  margin-bottom:16px;
  border-radius:8px;
}
.footer{
  text-align:center;
  margin-top:30px;
  opacity:0.6;
}
.result{margin-top:10px;font-size:14px;}
</style>
</head>

<body>

<h1>🐣 Secret Pet Hatch Calculator</h1>

<div id="ownerBox" class="owner" style="display:none;">
<b>📢 Owner Message:</b>
<div id="ownerText"></div>
</div>

<div class="menu">
  <button class="active" onclick="showSection('calc')">Calculator</button>
  <button onclick="showSection('eggs')">Egg Odds</button>
  <button onclick="showSection('sim')">Simulator</button>
</div>

<!-- CALCULATOR -->
<div id="calc" class="section" style="display:block;">
<label>Egg</label>
<select id="eggSelect"></select>

<label>Your Luck</label>
<input id="luck" placeholder="Ex: 22.8">

<label>Event Luck</label>
<input id="eventLuck" placeholder="Ex: 2">

<label>Admin Abuse Luck</label>
<input id="adminLuck" placeholder="Ex: 1000">

<label>Eggs Per Hatch</label>
<input id="eggsPer" value="8">

<label>Hatch Speed Multiplier</label>
<input id="hatchSpeed" value="1">

<button class="action" onclick="calculate()">Calculate</button>
<div id="calcResult" class="result"></div>
</div>

<!-- EGG ODDS -->
<div id="eggs" class="section">
<div id="eggOdds"></div>
</div>

<!-- SIMULATOR -->
<div id="sim" class="section">
<button class="action" onclick="simulate()">Simulate 100 Hatches</button>
<div id="simResult" class="result"></div>
</div>

<div class="footer">By: iQovz</div>

<script>
/* ========= EDIT ZONES ========= */
const OWNER_MESSAGE="🔥 Fire Ring Egg event live!";
const EGGS={
  "Basic Egg":{pets:[
    {name:"Dragon",rarity:"Legendary",chance:100},
    {name:"Royal Blob",rarity:"Secret",chance:100000}
  ]},
  "Fire Ring Egg":{pets:[
    {name:"Festival Bunny",rarity:"Legendary",chance:100},
    {name:"Festival Dragon",rarity:"Mythic",chance:1000},
    {name:"Fire Ring Lion",rarity:"Secret",chance:100000},
    {name:"Ultra Dice",rarity:"Secret",chance:500000}
  ]}
};
/* ============================== */

const eggSelect=document.getElementById("eggSelect");
Object.keys(EGGS).forEach(e=>{
  let o=document.createElement("option");
  o.value=e;o.textContent=e;
  eggSelect.appendChild(o);
});

if(OWNER_MESSAGE){
  ownerBox.style.display="block";
  ownerText.textContent=OWNER_MESSAGE;
}

function showSection(id){
  document.querySelectorAll(".section").forEach(s=>s.style.display="none");
  document.querySelectorAll(".menu button").forEach(b=>b.classList.remove("active"));
  document.getElementById(id).style.display="block";
  event.target.classList.add("active");
  if(id==="eggs") renderEggOdds();
}

function totalLuck(){
  return (+luck.value||0)+(+eventLuck.value||0)+(+adminLuck.value||0)||1;
}

function calculate(){
  const egg=EGGS[eggSelect.value];
  const secret=egg.pets.find(p=>p.rarity==="Secret");
  const l=totalLuck();
  const batchTime=2.57/(+hatchSpeed.value||1);
  const adj=secret.chance/l;
  const batches=adj/(+eggsPer.value||1);
  const time=(batches*batchTime)/60;

  calcResult.innerHTML=`
Your Current Luck: ${l.toFixed(2)}x<br>
Chances: 1/${Math.round(adj).toLocaleString()}<br>
Adjusted Hatch Time per Batch: ${batchTime.toFixed(2)}s<br>
Time to Hatch: ~${time.toFixed(2)} minutes
`;
}

function renderEggOdds(){
  let html="";
  Object.entries(EGGS).forEach(([egg,data])=>{
    html+=`<b>${egg}</b><br>`;
    data.pets.forEach(p=>{
      html+=`${p.name} (${p.rarity}) – 1/${p.chance.toLocaleString()}<br>`;
    });
    html+="<br>";
  });
  eggOdds.innerHTML=html;
}

function simulate(){
  const egg=EGGS[eggSelect.value];
  let counts={Legendary:0,Mythic:0,Secret:0};
  let rarest=null;
  for(let i=0;i<100;i++){
    egg.pets.forEach(p=>{
      if(Math.random()<1/p.chance){
        counts[p.rarity]++;
        if(!rarest||p.chance>rarest.chance) rarest=p;
      }
    });
  }
  simResult.innerHTML=`
Legendary: ${counts.Legendary}<br>
Mythic: ${counts.Mythic}<br>
Secret: ${counts.Secret}<br>
Rarest Pet: ${rarest?rarest.name:"None"}
`;
}
</script>

</body>
</html>
