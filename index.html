<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secret Pet Hatch Calculator - Polished</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f14;
    color: #eaeaea;
    display: flex;
    justify-content: center;
    padding: 30px 10px;
  }

  .box {
    background: #1c1c26;
    padding: 25px;
    border-radius: 12px;
    width: 520px;
    max-width: 100%;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }

  h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #00aaff;
  }

  .inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 20px;
    margin-bottom: 15px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
  }

  .input-group label {
    font-size: 13px;
    margin-bottom: 3px;
  }

  .input-group input {
    padding: 6px;
    font-size: 14px;
    border-radius: 5px;
    border: 1px solid #333;
    background: #0f0f14;
    color: #eaeaea;
    transition: background 0.2s;
  }

  .input-group input:focus {
    background: #1a1a28;
    outline: none;
  }

  button {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    margin-top: 10px;
    cursor: pointer;
    border-radius: 8px;
    border: none;
    background: linear-gradient(90deg, #00aaff, #0066cc);
    color: #fff;
    font-weight: bold;
    transition: 0.2s;
  }

  button:hover {
    background: linear-gradient(90deg, #00ccff, #004c99);
  }

  .output-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
  }

  pre {
    margin-top: 10px;
    white-space: pre-wrap;
    font-size: 14px;
    background: #0f0f14;
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #333;
  }

  /* Tooltip CSS */
  .info {
    position: relative;
    cursor: pointer;
    color: #00aaff;
    margin-left: 4px;
    font-weight: bold;
  }

  .tooltip {
    visibility: hidden;
    width: 280px;
    background-color: #333;
    color: #fff;
    text-align: left;
    border-radius: 6px;
    padding: 8px;
    position: absolute;
    z-index: 1;
    bottom: 125%;
    left: 50%;
    margin-left: -140px;
    opacity: 0;
    transition: opacity 0.3s;
    font-size: 12px;
  }

  .info:hover .tooltip {
    visibility: visible;
    opacity: 1;
  }

  @media(max-width: 600px){
    .inputs {
      grid-template-columns: 1fr;
    }
  }

  .signature {
    text-align:center; font-size:12px; margin-top:10px; color:#888;
  }

  .feedback {
    text-align:center; margin-top:5px;
  }

  .feedback a {
    color:#00aaff; text-decoration:none; font-size:13px;
  }
</style>
</head>
<body>

<div class="box">
  <h2>Secret Pet Hatch Calculator</h2>

  <div class="inputs">

    <div class="input-group">
      <label for="baseRarity">Base Rarity 🐣</label>
      <input id="baseRarity" placeholder="0.0002%, 1/25k, 25k, 1/25m, 25m">
    </div>

    <div class="input-group">
      <label for="yourLuck">
        Your Luck 🍀
        <span class="info">ℹ
          <span class="tooltip">
            🔹 To get your current luck, hover over every potion you have on and add all of them together.  
            🔹 Also add every gamepass to your luck.  
            🔹 Don’t forget purchasable luck around the map.  
            🔹 10% = 0.1x. Do <b>not</b> multiply them.  
            🔹 Example: (1.5x + 2x + 3x + 4x + 2x + 4x + 1.3x = 22.8)
          </span>
        </span>
      </label>
      <input id="yourLuck" placeholder="Your in-game luck multipliers">
    </div>

    <div class="input-group">
      <label for="eventLuck">Event Luck 🎉
        <span class="info">ℹ
          <span class="tooltip">
            Only include active event multipliers here. Separate from Your Luck.
          </span>
        </span>
      </label>
      <input id="eventLuck" value="1" placeholder="Optional, default 1">
    </div>

    <div class="input-group">
      <label for="adminLuck">Admin Abuse Luck 🛠️
        <span class="info">ℹ
          <span class="tooltip">
            Only for admin/spawned eggs. Leave 1 if not applicable.
          </span>
        </span>
      </label>
      <input id="adminLuck" value="1" placeholder="Optional, default 1">
    </div>

    <div class="input-group">
      <label for="eggsBatch">Eggs per Batch 🐣</label>
      <input id="eggsBatch" placeholder="Number of eggs hatched at once">
    </div>

    <div class="input-group">
      <label for="hatchSpeed">Hatch Speed ⏱️
        <span class="info">ℹ
          <span class="tooltip">
            Base hatch time per batch. Default 2.57 seconds.
          </span>
        </span>
      </label>
      <input id="hatchSpeed" value="2.57" placeholder="Default 2.57s">
    </div>

    <div class="input-group">
      <label for="hatchEvent">Hatch Speed Event Multiplier ⏱️
        <span class="info">ℹ
          <span class="tooltip">
            Multiply hatch speed reduction from events. Example: 2x makes batches hatch twice as fast.
          </span>
        </span>
      </label>
      <input id="hatchEvent" value="1" placeholder="Optional, default 1">
    </div>

  </div>

  <button id="calcBtn">Calculate</button>

  <div class="output-buttons">
    <button id="copyBtn">📋 Copy Output</button>
  </div>

  <pre id="output"></pre>

  <div class="feedback">
    <a href="https://forms.gle/https://forms.gle/W3JbqH4FnwxkobYr9" target="_blank">💬 Feedback</a>
  </div>

  <div class="signature">By: iQovz</div>
</div>

<script>
function parseRarity(input) {
  input = input.toLowerCase().replace(/,/g,"").trim();

  // Percentages
  if(input.endsWith("%")) {
    let val = Number(input.replace("%",""))/100;
    return Math.round(1/val);
  }

  // Fraction format 1/25k, 1/25m, etc.
  if(input.includes("/")) {
    let parts = input.split("/");
    let denom = parts[1];

    if(denom.endsWith("k")) denom = Number(denom.replace("k",""))*1000;
    else if(denom.endsWith("m")) denom = Number(denom.replace("m",""))*1000000;
    return Number(denom);
  }

  // Decimal <1
  let val = Number(input);
  if(val>0 && val<1) return Math.round(1/val);

  // Plain numbers with k/m
  if(input.endsWith("k")) return Number(input.replace("k",""))*1000;
  if(input.endsWith("m")) return Number(input.replace("m",""))*1000000;

  return Number(input);
}

document.getElementById("calcBtn").addEventListener("click", function() {
  const base = parseRarity(document.getElementById("baseRarity").value);
  const yourLuck = Number(document.getElementById("yourLuck").value) || 1;
  const eventLuck = Number(document.getElementById("eventLuck").value) || 1;
  const adminLuck = Number(document.getElementById("adminLuck").value) || 1;
  const eggsBatch = Number(document.getElementById("eggsBatch").value);
  const hatchSpeed = Number(document.getElementById("hatchSpeed").value) || 2.57;
  const hatchEvent = Number(document.getElementById("hatchEvent").value) || 1;

  if(!base || !eggsBatch || eggsBatch <=0){
    document.getElementById("output").textContent="Please enter valid Base Rarity and Eggs per Batch.";
    return;
  }

  const totalLuck = yourLuck * eventLuck * adminLuck;
  const odds = base / totalLuck;
  const totalBatches = odds / eggsBatch;
  const adjustedHatchTime = hatchSpeed / hatchEvent;
  const totalTimeSec = totalBatches * adjustedHatchTime;

  let displayTime;
  if(totalTimeSec < 60) displayTime = totalTimeSec.toFixed(2) + " seconds";
  else if(totalTimeSec < 3600) displayTime = (totalTimeSec/60).toFixed(2) + " minutes";
  else if(totalTimeSec < 86400) displayTime = (totalTimeSec/3600).toFixed(2) + " hours";
  else displayTime = (totalTimeSec/86400).toFixed(2) + " days";

  document.getElementById("output").textContent =
`Your Current Luck: ${totalLuck.toLocaleString()}x
Chances: 1/${Math.round(odds).toLocaleString()}
Time to Hatch: ~${displayTime}
Adjusted Hatch Time per Batch: ${adjustedHatchTime.toFixed(2)} seconds
Total Hatches needed: ${Math.round(totalBatches).toLocaleString()}`;
});

// Copy button
document.getElementById("copyBtn").addEventListener("click", function() {
  const output = document.getElementById("output").textContent;
  navigator.clipboard.writeText(output).then(() => {
    alert("Output copied to clipboard!");
  });
});
</script>

</body>
</html>
