<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secret Pet Hatch Simulator</title>

<style>
body{
  background:#0e1024;
  color:#fff;
  font-family:Arial,sans-serif;
  max-width:850px;
  margin:auto;
  padding:20px;
}
h1{text-align:center;}
.menu{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}
.menu button{
  flex:1;
  background:#2b2f66;
  color:white;
  border:none;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}
.menu button.active{background:#5d6bff;}
.section{
  display:none;
  background:#1a1e44;
  padding:16px;
  border-radius:12px;
}
label{display:block;margin-top:10px;font-size:14px;}
input,select{
  width:100%;
  padding:8px;
  margin-top:4px;
  border-radius:6px;
  border:none;
}
button.action{
  width:100%;
  margin-top:14px;
  padding:10px;
  background:#5d6bff;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
.owner{
  background:#2a2f66;
  border-left:6px solid #5d6bff;
  padding:10px;
  margin-bottom:16px;
  border-radius:8px;
}
.result{margin-top:10px;font-size:14px;line-height:1.5;}
.footer{
  text-align:center;
  margin-top:30px;
  opacity:0.6;
}
.feedback{
  margin-top:10px;
  text-align:center;
}
.feedback a{
  color:#9aa5ff;
  text-decoration:none;
  font-size:14px;
}
</style>
</head>

<body>

<h1>🐣 Secret Pet Hatch Simulator</h1>

<div id="ownerBox" class="owner" style="display:none;">
<b>📢 Owner Message:</b>
<div id="ownerText"></div>
</div>

<div class="menu">
  <button class="active" onclick="showSection('sim')">Simulator</button>
  <button onclick="showSection('calc')">Calculator</button>
  <button onclick="showSection('odds')">Egg Odds</button>
</div>

<!-- SIMULATOR -->
<div id="sim" class="section" style="display:block;">
<label>Egg</label>
<select id="eggSelect"></select>

<label>Your Luck (potions + gamepasses)</label>
<input id="luck" placeholder="Ex: 22.8">

<label>Event Luck</label>
<input id="eventLuck" placeholder="Ex: 2">

<label>Eggs Per Hatch</label>
<input id="eggsPer" value="8">

<label>Hatch Speed Multiplier</label>
<input id="hatchSpeed" value="1">

<button class="action" onclick="simulate()">Simulate 100 Eggs</button>
<div id="simResult" class="result"></div>
</div>

<!-- CALCULATOR -->
<div id="calc" class="section">
<div id="calcResult" class="result"></div>
</div>

<!-- EGG ODDS -->
<div id="odds" class="section">
<div id="eggOdds"></div>
</div>

<div class="feedback">
<a href="https://forms.gle/TbxWf1RvkZz3TZxo6" target="_blank">📝 Send Feedback</a>
</div>

<div class="footer">By: iQovz</div>

<script>
/* ================= EDITABLE ================= */
const OWNER_MESSAGE = "🔥 Luck event active! Simulator updated.";
const EGGS = {
  "Basic Egg":{pets:[
    {name:"Dragon",rarity:"Legendary",chance:100},
    {name:"Royal Blob",rarity:"Secret",chance:100000}
  ]},
  "Shark Egg":{pets:[
    {name:"Shark",rarity:"Legendary",chance:100}
  ]},
  "Glacier Egg":{pets:[
    {name:"Yeti",rarity:"Legendary",chance:52.63},
    {name:"Frost Dragon",rarity:"Mythic",chance:1000}
  ]},
  "Mystic Egg":{pets:[
    {name:"Taurus",rarity:"Legendary",chance:52.63},
    {name:"Goblin",rarity:"Mythic",chance:1000},
    {name:"Mystic Hexo",rarity:"Secret",chance:100000}
  ]},
  "Crystal Egg":{pets:[
    {name:"Dominus",rarity:"Mythic",chance:1000},
    {name:"Flying Gem",rarity:"Secret",chance:100000}
  ]},
  "Blossom Egg":{pets:[
    {name:"Blossom Dominus",rarity:"Mythic",chance:1000},
    {name:"Flower Trophy",rarity:"Secret",chance:100000},
    {name:"Eternal Flower",rarity:"Secret",chance:500000}
  ]}
};
/* ============================================ */

const eggSelect=document.getElementById("eggSelect");
Object.keys(EGGS).forEach(e=>{
  let o=document.createElement("option");
  o.value=e;o.textContent=e;
  eggSelect.appendChild(o);
});

if(OWNER_MESSAGE){
  ownerBox.style.display="block";
  ownerText.textContent=OWNER_MESSAGE;
}

function showSection(id){
  document.querySelectorAll(".section").forEach(s=>s.style.display="none");
  document.querySelectorAll(".menu button").forEach(b=>b.classList.remove("active"));
  document.getElementById(id).style.display="block";
  event.target.classList.add("active");
  if(id==="odds") renderEggOdds();
}

function totalLuck(){
  return ((+luck.value||0)+(+eventLuck.value||0)) || 1;
}

function simulate(){
  const egg=EGGS[eggSelect.value];
  const l=totalLuck();
  let counts={Legendary:0,Mythic:0,Secret:0};
  let rarest=null;

  for(let i=0;i<100;i++){
    egg.pets.forEach(p=>{
      if(Math.random() < (l / p.chance)){
        counts[p.rarity]++;
        if(!rarest || p.chance > rarest.chance) rarest=p;
      }
    });
  }

  simResult.innerHTML=`
Legendary: ${counts.Legendary}<br>
Mythic: ${counts.Mythic}<br>
Secret: ${counts.Secret}<br>
Rarest Pet: ${rarest ? rarest.name : "None"}
`;
}

function renderEggOdds(){
  let html="";
  Object.entries(EGGS).forEach(([egg,data])=>{
    html+=`<b>${egg}</b><br>`;
    data.pets.forEach(p=>{
      html+=`${p.name} (${p.rarity}) – 1/${p.chance.toLocaleString()}<br>`;
    });
    html+="<br>";
  });
  eggOdds.innerHTML=html;
}
</script>

</body>
</html>
