<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secret Pet Hatch Calculator - Full Version</title>
<style>
body {margin:0;font-family:Arial,sans-serif;background:#0f0f14;color:#eaeaea;display:flex;justify-content:center;padding:20px;}
.container {width:100%;max-width:700px;}
.announcement {
  background:#1f2937;
  border:1px solid #00aaff;
  color:#cfefff;
  padding:10px;
  border-radius:10px;
  text-align:center;
  margin-bottom:15px;
  font-size:14px;
}
.tabs {display:flex;justify-content:space-around;margin-bottom:15px;}
.tab {cursor:pointer;padding:10px 15px;border-radius:8px;background:#1c1c26;transition:0.2s;}
.tab.active {background:#00aaff;font-weight:bold;color:#fff;}
.section {display:none;background:#1c1c26;padding:20px;border-radius:12px;}
.section.active {display:block;}
.inputs {display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-bottom:15px;}
.input-group {display:flex;flex-direction:column;}
.input-group label {font-size:13px;margin-bottom:3px;}
.input-group input, select {
  padding:6px;font-size:14px;border-radius:5px;border:1px solid #333;
  background:#0f0f14;color:#eaeaea;
}
button {
  padding:10px;font-size:16px;border:none;border-radius:8px;cursor:pointer;
  background:linear-gradient(90deg,#00aaff,#0066cc);color:#fff;font-weight:bold;
}
pre {
  margin-top:10px;white-space:pre-wrap;font-size:14px;
  background:#0f0f14;padding:10px;border-radius:5px;border:1px solid #333;
}
.feedback {text-align:center;margin-top:5px;}
.feedback a {color:#00aaff;text-decoration:none;font-size:13px;}
.signature {text-align:center;font-size:12px;margin-top:10px;color:#888;}
@media(max-width:600px){.inputs{grid-template-columns:1fr;}}
</style>
</head>

<body>
<div class="container">

<div id="announcementBox" class="announcement"></div>

<div class="tabs">
  <div class="tab active" data-tab="single">Single Pet Calculator</div>
  <div class="tab" data-tab="multi">Multi-Egg Odds</div>
  <div class="tab" data-tab="sim">Hatch Simulator</div>
</div>

<div class="section active" id="single">
  <div class="inputs">
    <div class="input-group"><label>Base Rarity</label><input id="baseRarity"></div>
    <div class="input-group"><label>Your Luck</label><input id="yourLuck"></div>
    <div class="input-group"><label>Event Luck</label><input id="eventLuck" value="1"></div>
    <div class="input-group"><label>Admin Luck</label><input id="adminLuck" value="1"></div>
    <div class="input-group"><label>Eggs per Batch</label><input id="eggsBatch"></div>
  </div>
  <button id="calcBtn">Calculate</button>
  <pre id="output"></pre>
</div>

<div class="section" id="multi">
  <div class="inputs">
    <div class="input-group" style="grid-column:1/-1;">
      <label>Egg</label><select id="eggSelect"></select>
    </div>
    <div class="input-group"><label>Your Luck</label><input id="multiYourLuck" value="1"></div>
    <div class="input-group"><label>Event Luck</label><input id="multiEventLuck" value="1"></div>
  </div>
  <button id="multiCalcBtn">Calculate</button>
  <pre id="multiOutput"></pre>
</div>

<div class="section" id="sim">
  <div class="inputs">
    <div class="input-group"><label>Egg</label><select id="simEggSelect"></select></div>
    <div class="input-group"><label>Your Luck</label><input id="simYourLuck" value="1"></div>
    <div class="input-group"><label>Event Luck</label><input id="simEventLuck" value="1"></div>
    <div class="input-group"><label>Eggs</label><input id="simBatches" value="100"></div>
  </div>
  <button id="simBtn">Simulate</button>
  <pre id="simOutput"></pre>
</div>

<div class="feedback">
  <a href="https://forms.gle/TbxWf1RvkZz3TZxo6" target="_blank">💬 Feedback</a>
</div>
<div class="signature">By: iQovz</div>

</div>

<script>
// ================== ANNOUNCEMENT ==================
const ANNOUNCEMENT_TEXT = "🔥 New Eggs Added! Magic Egg & Fire Ring Egg are now available.";
const ANNOUNCEMENT_ENABLED = true;

if(ANNOUNCEMENT_ENABLED){
  announcementBox.textContent = ANNOUNCEMENT_TEXT;
} else {
  announcementBox.style.display = "none";
}

// ================== TABS ==================
document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick=()=>{
    document.querySelectorAll('.tab,.section').forEach(e=>e.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab).classList.add('active');
  };
});

// ================== DATA ==================
const eggsData = {
  "Basic":[
    {name:"Dragon",chance:100},
    {name:"Royal Blob",chance:100000}
  ],
  "Shark":[
    {name:"Shark",chance:100}
  ],
  "Glacier":[
    {name:"Yeti",chance:52.63},
    {name:"Frost Dragon",chance:1000}
  ],
  "Mystic":[
    {name:"Taurus",chance:52.63},
    {name:"Goblin",chance:1000},
    {name:"Mystic Hexo",chance:100000}
  ],
  "Crystal":[
    {name:"Dominus",chance:1000},
    {name:"Flying Gem",chance:100000}
  ],
  "Blossom":[
    {name:"Blossom Dominus",chance:1000},
    {name:"Flower Trophy",chance:100000},
    {name:"Eternal Flower",chance:500000}
  ],
  "Magic":[
    {name:"Clown",chance:25000}
  ],
  "Fire Ring":[
    {name:"Festival Bunny",chance:100},
    {name:"Festival Dragon",chance:1000},
    {name:"Fire Ring Lion",chance:100000},
    {name:"Ultra Dice",chance:500000}
  ]
};

// ================== POPULATE ==================
[eggSelect, simEggSelect].forEach(sel=>{
  Object.keys(eggsData).forEach(e=>{
    let o=document.createElement('option');
    o.value=o.textContent=e;
    sel.appendChild(o);
  });
});

// ================== MULTI ==================
multiCalcBtn.onclick=()=>{
  let egg=eggSelect.value;
  let luck=(+multiYourLuck.value||1)*(+multiEventLuck.value||1);
  multiOutput.textContent=eggsData[egg]
    .map(p=>`${p.name}: 1/${Math.round(p.chance/luck).toLocaleString()}`)
    .join('\n');
};

// ================== SIM ==================
simBtn.onclick=()=>{
  let egg=simEggSelect.value;
  let luck=(+simYourLuck.value||1)*(+simEventLuck.value||1);
  let rolls=+simBatches.value||100;
  let results={};
  eggsData[egg].forEach(p=>results[p.name]=0);

  for(let i=0;i<rolls;i++){
    for(const p of eggsData[egg]){
      if(Math.random()<luck/p.chance){results[p.name]++;break;}
    }
  }

  simOutput.textContent=`Simulated ${rolls} eggs:\n`+
    Object.entries(results).map(([k,v])=>`${k}: ${v}`).join('\n');
};
</script>
</body>
</html>
